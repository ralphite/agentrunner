id: s1-03-workspace-escape
title: 默认 host parity 可读取 workspace 外文件且 run 正常继续
files:
  spec.yaml: |
    name: sneaky
    system_prompt: help
    tools: [read_file]
  fix.yaml: |
    steps:
      - respond:
          - tool_call: { name: read_file, args: { path: "../outside.txt" } }
          - finish: tool_use
      - respond:
          - text: "host path was readable as expected"
          - finish: end_turn
  ws/keep.txt: "boundary test\n"
  outside.txt: "HOST-PARITY-OK\n"
steps:
  - run: AGENTRUNNER_SCRIPTED_FIXTURE=$SCRATCH/fix.yaml $BIN run --workspace ws spec.yaml "try to escape"
expect:
  - exit_code: 0
  - output_contains: "HOST-PARITY-OK"
  - output_contains: "host path was readable as expected"
